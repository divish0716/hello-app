name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '운영 배포할 릴리즈 태그 (예: 1.2.3)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: "ghcr.io/${{ github.repository }}/hello-app"

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.set_tag.outputs.TAG }}
    steps:
      # ✅ 입력값 복원
      - name: Set release tag
        id: set_tag
        run: |
          echo "TAG=${{ github.event.inputs.release_tag }}" >> $GITHUB_ENV
          echo "TAG=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT

      # 🔢 태그 형식 검증
      - name: Validate tag format
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag format must be MAJOR.MINOR.PATCH (e.g., 1.2.3)"
            exit 1
          fi

      # 🔍 검증계에서 통과한 태그인지 확인
      - name: Check tag is verified in STA
        run: |
          VERIFIED_TAGS=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases | jq -r '.[].tag_name')
          if ! echo "$VERIFIED_TAGS" | grep -q "^$TAG$"; then
            echo "Error: Tag $TAG has not been verified in STA!"
            exit 1
          fi

  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      # ✅ 코드 체크아웃 (릴리즈 생성용)
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔐 GHCR 로그인
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 📥 Docker 이미지 Pull (운영계)
      - name: Pull Docker image
        run: |
          docker pull $IMAGE_NAME:${{ needs.validate.outputs.TAG }}

      # 🧪 운영계 테스트 (간단히 컨테이너 실행)
      - name: Run Docker image for verification
        run: |
          docker run --rm -d -p 80:80 $IMAGE_NAME:${{ needs.validate.outputs.TAG }}

      # 테스트 스크립트 실행 (선택)
      - name: Run smoke test
        run: |
          ./infra/test/smoke.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # 🚢 실제 운영계 배포
      - name: Deploy Docker image
        run: |
          echo "Deploying $IMAGE_NAME:${{ needs.validate.outputs.TAG }} to Production..."
          # 여기 실제 운영 배포 명령어 삽입 (예: kubectl, ECS, SSH 등)
