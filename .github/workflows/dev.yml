# main 브랜치의 파일이 변경되었을 때 실행

name: Deploy to Dev

on:
  push:
    branches: [main, dowon.choi]

concurrency:
  group: branch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: "ghcr.io/${{ github.repository }}/hello-app"

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      DOCKER_TAG: ${{ steps.set_tag.outputs.DOCKER_TAG }}

    steps:
      # 체크아웃: 코드 리포지토리 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # Docker 태그 계산 및 환경 변수 설정
      - name: Set Docker tag
        id: set_tag
        run: |
          TAG="$(date +'%Y%m%d-%H%M')"
          echo "Calculated Docker tag: $TAG"
          echo "DOCKER_TAG=$TAG" >> $GITHUB_ENV
          echo "DOCKER_TAG=$TAG" >> $GITHUB_OUTPUT

      # Docker 이미지 빌드
      - name: Build Docker image
        run: |
          docker build -f infra/docker/dockerfile -t $IMAGE_NAME:$DOCKER_TAG .

      # GHCR 로그인
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Docker 이미지 Push
      - name: Push Docker image to GHCR
        run: |
          docker push $IMAGE_NAME:$DOCKER_TAG

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # build job에서 생성한 Docker 태그 가져오기
      - name: Get docker tag
        run: |
          echo "DOCKER_TAG=${{ needs.build.outputs.DOCKER_TAG }}" >> $GITHUB_ENV

      # GHCR 로그인
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Docker 이미지 Pull
      - name: Pull Docker image
        run: |
          docker pull $IMAGE_NAME:$DOCKER_TAG

      # Docker 컨테이너 실행
      - name: Run Docker image
        run: |
          docker run -d -p 80:80 $IMAGE_NAME:$DOCKER_TAG

      # 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 스모크 테스트 실행
      - name: Run smoke test
        run: |
          ./infra/test/smoke.sh

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
